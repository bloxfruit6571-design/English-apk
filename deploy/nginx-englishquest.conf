# ============================================================================
# nginx — reverse proxy HTTPS untuk English Quest API (alternatif Caddy)
# ============================================================================
# Ganti GANTI_DOMAIN_ANDA dengan domain Anda. Terbitkan sertifikat lebih dulu:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d GANTI_DOMAIN_ANDA
#
# Pasang: sudo cp deploy/nginx-englishquest.conf /etc/nginx/sites-available/englishquest
#         sudo ln -s /etc/nginx/sites-available/englishquest /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# ============================================================================

server {
	listen 80;
	listen [::]:80;
	server_name GANTI_DOMAIN_ANDA;

	# Selalu alihkan ke HTTPS; API menolak permintaan non-HTTPS.
	location / {
		return 301 https://$host$request_uri;
	}

	# Cerbot memakai jalur ini untuk verifikasi HTTP-01.
	location /.well-known/acme-challenge/ {
		root /var/www/html;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	# Aktifkan HTTP/2 sesuai versi nginx yang dipasang.
	server_name GANTI_DOMAIN_ANDA;

	# Diisi otomatis oleh `certbot --nginx`, atau arahkan manual ke sertifikat Anda.
	ssl_certificate     /etc/letsencrypt/live/GANTI_DOMAIN_ANDA/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/GANTI_DOMAIN_ANDA/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;

	# Batas ukuran isi permintaan (API memakai batas 32 KiB sendiri).
	client_max_body_size 64k;

	# Panel admin tidak dibuka ke internet (buka lewat SSH tunnel bila perlu).
	location ^~ /api/admin {
		return 404;
	}

	access_log off;
	location / { return 404; }
	location /api/ {
		proxy_pass http://127.0.0.1:8088;
		proxy_http_version 1.1;

		# Wajib: server memakai header ini untuk mengenali koneksi HTTPS
		# (EQ_TRUST_PROXY=1) dan untuk membatasi percobaan per alamat IP.
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header Host $host;

		# Koneksi ke API lokal tidak boleh lambat; jangan biarkan menggantung.
		proxy_connect_timeout 5s;
		proxy_read_timeout 30s;
	}
}
