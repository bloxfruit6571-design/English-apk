<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef4ff" />
  <meta name="description" content="English Quest — belajar bahasa Inggris dari nol lewat pelajaran, cerita, dan permainan." />
  <title>English Quest — Belajar Bahasa Inggris dari Nol</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    // Plain-HTTP servers are only ever allowed for loopback development. Inside the Android app the
    // page origin is the WebView asset origin (https), so the native bridge is asked instead: it
    // reports true only for debug builds compiled with -PEQ_ALLOW_HTTP_DEV=1.
    window.EQ_ALLOW_HTTP_DEV = (location.protocol === 'http:' && ['localhost', '127.0.0.1', '::1'].includes(location.hostname))
      || (function () {
        try {
          const bridge = window.EnglishQuestAndroid;
          return !!(bridge && typeof bridge.isHttpDevAllowed === 'function' && bridge.isHttpDevAllowed() === true);
        } catch (_) { return false; }
      })();
  </script>
  <script defer src="./library-data.js"></script>
  <script defer src="./mission-data.js"></script>
  <script defer src="./mission-data-extras.js"></script>
  <script defer src="./access-client.js"></script>
  <script defer src="./app.js"></script>
</body>
</html>
